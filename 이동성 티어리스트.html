<!-- 팀원 아이템 시작 (주의: id 값은 팀원마다 고유하게 변경하세요) -->
<style>
    .item {
        width: 80px;
        height: 80px;
        cursor: grab;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        position: relative;
    }

    .item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .item .item-name {
        position: absolute;
        bottom: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.9);
        color: white;
        font-size: 0.7rem;
        text-align: center;
        padding: 4px 0;
    }
</style>
